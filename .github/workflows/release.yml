name: Release

# Builds installers on each OS runner (avoids wine/cross-build flakiness).
# Tag push (v*) → build + publish to GitHub Releases.
# Manual run → build only by default (set publish=true to upload).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: windows-latest (2025) previously stalled at the NSIS
        # phase even with store compression. Stick to the known-good image.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # mx=1 compression finishes in ~1–3 min locally; 15 min is a hard stall guard.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Disable Defender scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($s in @(
            @{DisableRealtimeMonitoring   = $true},
            @{DisableBehaviorMonitoring   = $true},
            @{DisableIOAVProtection       = $true},
            @{DisableScanOnRealtimeEnable = $true},
            @{DisableArchiveScanning      = $true}
          )) {
            try { Set-MpPreference @s } catch { Write-Host "could not set $($s.Keys): $_" }
          }
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP,
                           "$env:LOCALAPPDATA\electron", "$env:LOCALAPPDATA\electron-builder")) {
            try { Add-MpPreference -ExclusionPath $p } catch { }
          }

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      - name: Generate icons
        run: npm run icons

      # Publish on version tags, or when the manual "publish" input is checked.
      - name: Resolve publish mode
        id: pub
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MODE=always
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            MODE=always
          else
            MODE=never
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "publish mode → $MODE"

      # macOS: default compression is fine (~2–4 min, smaller .dmg/.zip).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows: ELECTRON_BUILDER_COMPRESSION_LEVEL overrides the default
      # ultra LZMA (-mx=9) that took 25–45 min on GH runners.
      # Level 1 → ~80 MB setup.exe in ~1–3 min (benchmarked: 233→79 MB / 3s).
      # shell: bash required so env + args aren't mangled by PowerShell.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win nsis --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"

      - name: Upload build artifacts
        if: steps.pub.outputs.mode == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7
