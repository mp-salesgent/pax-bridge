name: Release

# Builds and publishes installers for every platform on a version tag push,
# or on demand via the Actions tab (workflow_dispatch). Each OS builds its own
# native installer on its own runner — this avoids the wine/cross-build
# reliability issues of building Windows from macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      win_compression:
        description: "Windows installer compression. store = ~4 min build / ~220 MB exe. normal = LZMA, ~95 MB exe, but this exact step once ran 44 min on a GitHub runner — use when installer size matters more than build time."
        type: choice
        options: [store, normal]
        default: store

# Lets the built-in GITHUB_TOKEN create/update the Release and upload assets,
# without needing a personal access token as a secret.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Both jobs should finish in ~2-4 min. If one blows past this, it's stuck,
    # and failing fast is better than burning 45 min of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Minor I/O win, NOT the fix for the slow build — a run with
      # "RealtimeMonitoringDisabled = True" still took 44 min, which is how the
      # real cause (7-Zip ultra compression, see the Windows build step) was
      # finally identified. Kept because it's cheap (~8s) and reduces write
      # overhead. Runners are ephemeral and destroyed after the job.
      - name: Disable Defender scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($s in @(
            @{DisableRealtimeMonitoring   = $true},
            @{DisableBehaviorMonitoring   = $true},
            @{DisableIOAVProtection       = $true},
            @{DisableScanOnRealtimeEnable = $true},
            @{DisableArchiveScanning      = $true}
          )) {
            try { Set-MpPreference @s } catch { Write-Host "could not set $($s.Keys): $_" }
          }
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP,
                           "$env:LOCALAPPDATA\electron", "$env:LOCALAPPDATA\electron-builder")) {
            try { Add-MpPreference -ExclusionPath $p } catch { }
          }
          $p = Get-MpPreference
          Write-Host "RealtimeMonitoring disabled : $($p.DisableRealtimeMonitoring)"
          Write-Host "BehaviorMonitoring disabled : $($p.DisableBehaviorMonitoring)"
          Write-Host "ArchiveScanning disabled    : $($p.DisableArchiveScanning)"

      # electron-builder downloads the Electron runtime (~115 MB) plus its NSIS
      # and winCodeSign helper binaries on every cold run. Caching them removes
      # that download from subsequent builds.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      # Explicit step because the Windows build below calls electron-builder
      # directly (to override compression) and so skips `prepare:build`, which
      # is what normally generates build/icon.ico and build/icon.icns.
      - name: Generate icons
        run: npm run icons

      # macOS keeps full compression — that job already finishes in ~2 min and
      # a smaller .dmg is worth it.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE fix for the 25-45 min Windows build. Confirmed from the job log:
      #   05:17:48  executing 7za.exe a -bd -mx=9 ... nsis.7z
      #   06:01:45  cancelled by SIGINT
      # i.e. 44 minutes inside a single 7-Zip call. `-mx=9` is *ultra* LZMA over
      # the ~250 MB unpacked app, and it dominates everything else in the build.
      # "store" drops it to the fastest setting. Trade-off: a larger setup.exe.
      # Auto-update is unaffected — blockmap deltas diff uncompressed data even
      # better, so customers still download only what changed.
      # shell: bash is required — PowerShell splits `-c.compression=store` into
      # `-c` + `.compression=store`, so electron-builder tries to open a config
      # FILE named ".compression=store" and dies with ENOENT. bash passes it as
      # a single token and yargs parses the dot-notation override correctly.
      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win nsis --publish always -c.compression=${{ inputs.win_compression || 'store' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
