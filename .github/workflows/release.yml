name: Release

# Builds and publishes installers for every platform on a version tag push,
# or on demand via the Actions tab (workflow_dispatch). Each OS builds its own
# native installer on its own runner — this avoids the wine/cross-build
# reliability issues of building Windows from macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN create/update the Release and upload assets,
# without needing a personal access token as a secret.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Defender scans every file electron-builder writes, and NSIS/7z compress
      # the ~200 MB app as thousands of small writes — this made the Windows job
      # hang for 25+ min at the NSIS step. Turning real-time monitoring off
      # outright is the reliable fix: earlier attempts only excluded the
      # workspace, but electron-builder stages the NSIS build in the *system
      # temp dir*, so the slow path was never actually excluded.
      # Runners are ephemeral, isolated and destroyed after the job.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath $env:TEMP
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
          # Report the result so a silent failure can't hide again.
          $p = Get-MpPreference
          Write-Host "RealtimeMonitoringDisabled = $($p.DisableRealtimeMonitoring)"
          Write-Host "ExclusionPath = $($p.ExclusionPath -join ', ')"

      # electron-builder downloads the Electron runtime (~115 MB) plus its NSIS
      # and winCodeSign helper binaries on every cold run. Caching them removes
      # that download from subsequent builds.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verbose logging on Windows only: if the NSIS step stalls again this
          # shows the exact command it's sitting on instead of a silent gap.
          DEBUG: ${{ runner.os == 'Windows' && 'electron-builder' || '' }}
