name: Release

# macOS app  → macos-latest
# Windows NSIS → also macos-latest (NOT windows-*/ubuntu)
#
# Why: windows-2022 hangs 15+ min at "building target=nsis" (Defender/7za).
# Ubuntu needs wine for NSIS uninstaller generation. macOS 10.15+ uses
# electron-builder's UninstallerReader instead of wine, so unsigned Windows
# NSIS builds complete there without wine or the Windows-runner stall.
#
# Tag push (v*) → build + publish. Manual run → build only unless publish=true.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            args: --mac
          - platform: win
            args: --win nsis --x64
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: mac-${{ matrix.platform }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-${{ matrix.platform }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      - name: Generate icons
        run: npm run icons

      - name: Resolve publish mode
        id: pub
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MODE=always
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            MODE=always
          else
            MODE=never
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "publish mode → $MODE"

      - name: Build ${{ matrix.platform }}
        run: npx electron-builder ${{ matrix.args }} --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Windows-only: fast compression (~80 MB setup). Harmless on mac.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"

      - name: Upload build artifacts
        if: steps.pub.outputs.mode == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7
