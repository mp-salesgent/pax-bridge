appId: com.salesgent.paxbridge
productName: Salesgent Pax Bridge
copyright: Copyright © Salesgent

directories:
  buildResources: build
  output: release

# App code that goes inside the asar. The bridge server ships separately as an
# unpacked resource (below) because it runs as its own Node process.
files:
  - src/**/*
  - package.json
  - "!**/*.map"

# The embedded PAX bridge (Express server + its production node_modules) is
# copied verbatim next to the app so utilityProcess can fork bridge/index.js.
# Run `npm run bridge:install` first (dist scripts do this) to populate its deps.
extraResources:
  - from: bridge
    to: bridge
    filter:
      - "**/*"
      - "!**/*.md"
      - "!**/.env"
      - "!**/data/**"

asar: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip           # zip target is required for electron-updater on mac
      arch: [arm64, x64]
  category: public.app-category.point-of-sale
  icon: build/icon.icns
  # Artifact filenames intentionally do NOT change with the product rename:
  # they're stable (no ${version}) so GitHub's /releases/latest/download/<name>
  # redirect keeps working, and the ERP's download buttons already link to
  # these exact names (PAX-Bridge-mac-${arch}.dmg / PAX-Bridge-Setup.exe).
  artifactName: "PAX-Bridge-mac-${arch}.${ext}"
  # Unsigned builds run after a right-click → Open. Add identity + notarize later.
  identity: null

dmg:
  # ${arch} is required here: electron-builder builds the arm64 and x64 dmg
  # in parallel, and hdiutil mounts each one as a volume named after this
  # title. Without ${arch} both builds fight over a volume named identically
  # ("Salesgent Pax Bridge 1.0.0"), and whichever loses gets "resource busy"
  # trying to detach the other's mount — this is what broke the last release.
  title: "Salesgent Pax Bridge ${version} ${arch}"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "PAX-Bridge-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Salesgent Pax Bridge

linux:
  target: [AppImage]
  category: Utility
  icon: build/icon.png

# Auto-update feed. electron-updater reads releases from this GitHub repo.
# Create the repo (or point owner/repo at an existing one) and publish with
# `npm run release` (needs a GH_TOKEN with repo scope).
publish:
  provider: github
  owner: mp-salesgent
  repo: pax-bridge
  releaseType: release
