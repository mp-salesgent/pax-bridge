name: Release

# macOS builds on macos-latest.
# Windows builds on ubuntu-latest (cross-compile). Unsigned Windows NSIS does
# NOT need wine — electron-builder uses native Linux 7za + makensis. Building
# NSIS on windows-2022 hangs for 15+ min at "building target=nsis" (Defender /
# 7za stall); packaging itself finishes in seconds, then the archive step never
# returns. Linux avoids that entirely.
#
# Tag push (v*) → build + publish. Manual run → build only unless publish=true.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.platform }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      - name: Generate icons
        run: npm run icons

      - name: Resolve publish mode
        id: pub
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MODE=always
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            MODE=always
          else
            MODE=never
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "publish mode → $MODE"

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Cross-compile Windows NSIS on Linux. Level 1 ≈ 80 MB setup in ~1–2 min.
      - name: Build (Windows on Linux)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"

      - name: Upload build artifacts
        if: steps.pub.outputs.mode == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7
