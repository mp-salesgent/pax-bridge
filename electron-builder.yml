appId: com.salesgent.paxbridge
productName: Salesgent Pax Bridge
copyright: Copyright © Salesgent

directories:
  buildResources: build
  output: release

# App code inside the asar. Bridge ships separately as an unpacked resource
# because it runs as its own Node process via utilityProcess.
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/{test,tests,docs,__tests__}/**"
  - "!**/*.{md,markdown,ts,map}"

# Embedded PAX bridge (Express + production deps). Filters keep only runtime
# files — serialport prebuilds for other OSes are stripped in afterPack.
extraResources:
  - from: bridge
    to: bridge
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/data/**"
      - "!**/*.{md,markdown,map,ts}"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/docs/**"
      - "!**/example/**"
      - "!**/examples/**"
      - "!**/node_modules/@serialport/bindings-cpp/{src,binding.gyp,LICENSE,README.md}"
      - "!**/node_modules/node-addon-api/**"
      - "!**/node_modules/**/{CHANGELOG*,HISTORY*,README*,LICENSE*,LICENCE*,.npmignore,.eslintrc*,.prettierrc*}"

asar: true

# English only — Chromium ships ~55 locale packs (~25–30 MB).
electronLanguages:
  - en-US
  - en

# Trims unused Electron/runtime files + wrong-OS native prebuilds, then
# ad-hoc re-signs the macOS .app so Gatekeeper doesn't report "damaged".
afterPack: build/after-pack.js

# Default is electron-builder's "normal" (= 7z -mx=9 for NSIS), which can take
# 25–45 min on GitHub Windows runners. CI overrides with
# ELECTRON_BUILDER_COMPRESSION_LEVEL=1 → ~80 MB installer in ~1–2 min.
# Local scripts set the same env so `npm run dist:win` stays fast.

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.point-of-sale
  icon: build/icon.icns
  # Stable names (no ${version}) so /releases/latest/download/... links keep working.
  artifactName: "PAX-Bridge-mac-${arch}.${ext}"
  identity: null

dmg:
  # ${arch} required: arm64 + x64 dmg builds run in parallel and must not share
  # the same hdiutil volume name.
  title: "Salesgent Pax Bridge ${version} ${arch}"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "PAX-Bridge-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Salesgent Pax Bridge
  # Keep differential packaging (blockmap) for small auto-updates.
  differentialPackage: true

linux:
  target: [AppImage]
  category: Utility
  icon: build/icon.png

publish:
  provider: github
  owner: mp-salesgent
  repo: pax-bridge
  releaseType: release
