name: Release

# macOS app  → macos-latest
# Windows NSIS → also macos-latest (NOT windows-*/ubuntu)
#
# Why: windows-2022 hangs 15+ min at "building target=nsis" (Defender/7za).
# Ubuntu needs wine for NSIS uninstaller generation. macOS 10.15+ uses
# electron-builder's UninstallerReader instead of wine, so unsigned Windows
# NSIS builds complete there without wine or the Windows-runner stall.
#
# Tag push (v*) → build + publish. Manual run → build only unless publish=true.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Set release notes before builds upload artifacts, so the release page
  # always has a clear download guide even while builds are still running.
  release-notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.ver.outputs.version }}" --notes "$(cat <<'BODY'
          ## 📥 Download the right file for your system

          | File | Platform | What is it? |
          |------|----------|-------------|
          | [PAX-Bridge-Setup.exe](https://github.com/mp-salesgent/pax-bridge/releases/latest/download/PAX-Bridge-Setup.exe) | Windows | Installer — double-click to install. Creates Start Menu & desktop shortcuts. |
          | [PAX-Bridge-mac-arm64.dmg](https://github.com/mp-salesgent/pax-bridge/releases/latest/download/PAX-Bridge-mac-arm64.dmg) | macOS (Apple Silicon) | Installer for M1/M2/M3/M4 Macs. Drag to Applications. |
          | [PAX-Bridge-mac-x64.dmg](https://github.com/mp-salesgent/pax-bridge/releases/latest/download/PAX-Bridge-mac-x64.dmg) | macOS (Intel) | Installer for older Intel-based Macs. Drag to Applications. |

          Not sure which Mac you have? Click Apple menu → About This Mac. If "Chip" says M1/M2/M3/M4, download arm64. Otherwise download x64.
          BODY
          )" || echo "Release not created yet by electron-builder; notes will apply once it exists."

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            args: --mac
          - platform: win
            args: --win nsis --x64
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: mac-${{ matrix.platform }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-${{ matrix.platform }}-electron-

      - name: Install app dependencies
        run: npm ci

      - name: Install bridge dependencies
        run: npm run bridge:install

      - name: Generate icons
        run: npm run icons

      - name: Resolve publish mode
        id: pub
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MODE=always
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            MODE=always
          else
            MODE=never
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "publish mode → $MODE"

      - name: Build ${{ matrix.platform }}
        run: npx electron-builder ${{ matrix.args }} --publish ${{ steps.pub.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Windows-only: fast compression (~80 MB setup). Harmless on mac.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"

      - name: Upload build artifacts
        if: steps.pub.outputs.mode == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7
