# Windows CI build config: identical to the base config but with compression
# disabled ("store").
#
# Why a separate FILE and not `-c.compression=store` on the CLI: that flag is
# silently ignored — the CI job log proved 7za still ran with -mx=9 (ultra
# LZMA) while the flag was present, which is what stalled every Windows build
# past the 15-minute timeout. A config file is applied unconditionally.
#
# Trade-off: setup.exe is ~220 MB instead of ~95 MB. Auto-update deltas are
# unaffected (blockmaps diff uncompressed data). To ship the small installer
# instead, run the workflow manually with win_compression=normal — and budget
# 45+ minutes, since ultra LZMA over ~240 MB is what it is on these runners.
extends: ./electron-builder.yml
compression: store
